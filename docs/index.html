<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>duck-studio · 訓練版本</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#101412;color:#e8eee8;font:16px/1.6 system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:32px 20px}h1{margin:0;color:#caf56a}h2{font-size:19px}p,small{color:#a1afa4}section{background:#19201c;border:1px solid #303b33;border-radius:12px;padding:22px;margin-top:20px}label{display:block;margin:12px 0}select{width:100%;padding:10px;color:inherit;background:#202a23;border:1px solid #53653d;border-radius:8px;font:inherit}table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:12px;border-bottom:1px solid #303b33}.scroll{overflow:auto}.changed{color:#caf56a}svg{width:100%;height:auto}a{color:#83baff}.note{border-left:3px solid #caf56a;padding-left:14px}#error{color:#ffb7ad}button{font:inherit;padding:8px 14px;cursor:pointer}</style><main><h1>duck-studio</h1><p>訓練版本與成果紀錄</p><p class="note">查看版 · 顯示最後匯出的資料，並非即時訓練狀態。訓練與參數修改在桌機進行。</p><small id="stamp">正在讀取資料…</small><p id="error" role="alert"></p><section><label>1 · 實驗版本<select id="version"></select></label><h2>參數與修改內容</h2><div class="scroll"><table><thead><tr><th>參數</th><th>父版本</th><th>所選版本</th></tr></thead><tbody id="params"></tbody></table></div><p>重心 X 是軀幹局部質心位置；根部 HOME Z 是初始偏移，並非實際站立高度。</p><label>2 · 此版本的訓練記錄<select id="run"></select></label></section><section><h2>訓練曲線快照</h2><label>指標<select id="metric"></select></label><p id="latest"></p><div id="plot"></div></section><section><h2>已保存 checkpoint 清單</h2><p>此頁只同步檔名，未上傳模型檔案。</p><p id="checkpoints"></p><a href="data.json" download="duck-studio-data.json">下載版本及曲線資料 JSON</a></section></main><script>
const $=id=>document.getElementById(id);let data,rs=[];const fmt=n=>new Intl.NumberFormat('zh-Hant',{maximumFractionDigits:3}).format(n);
function options(el,items){el.replaceChildren(...items.map(([v,t])=>new Option(t,v)));el.disabled=!items.length}
function version(){const v=data.versions.find(v=>v.id===$('version').value),p=data.versions.find(p=>p.id===v.parent);$('params').replaceChildren();for(const [k,label,unit] of [['home_deg','髖／踝 HOME 幅度','°'],['kp','模擬 kp_fw',''],['com_x_mm','軀幹局部重心 X',' mm'],['root_z_mm','根部 HOME Z',' mm'],['stand_z_mm','模型站立高度',' mm']]){let row=document.createElement('tr');for(const text of [label,p?fmt(p.params[k])+unit:'—',fmt(v.params[k])+unit]){let c=document.createElement('td');c.textContent=text;row.append(c)}if(p&&p.params[k]!==v.params[k])row.lastChild.className='changed';$('params').append(row)}rs=data.runs.filter(r=>r.version===v.id).reverse();options($('run'),rs.map((r,i)=>[String(i),r.experiment+' / '+r.name]));run()}
function run(){const r=rs[Number($('run').value)];options($('metric'),Object.keys(r?.series||{}).sort().map(t=>[t,t]));if(r?.series['Train/mean_reward'])$('metric').value='Train/mean_reward';$('checkpoints').textContent=r?.checkpoints.join(' · ')||'尚無記錄';draw()}
function draw(){const pts=rs[Number($('run').value)]?.series[$('metric').value]||[];$('plot').replaceChildren();$('latest').textContent=pts.length?'第 '+pts.at(-1)[0]+' 輪 · '+fmt(pts.at(-1)[1]):'尚無指標資料';if(!pts.length)return;let lo=Math.min(...pts.map(p=>p[1])),hi=Math.max(...pts.map(p=>p[1]));if(lo===hi){lo--;hi++}const min=pts[0][0],max=pts.at(-1)[0],ns='http://www.w3.org/2000/svg',svg=document.createElementNS(ns,'svg');svg.setAttribute('viewBox','0 0 900 260');svg.setAttribute('role','img');svg.setAttribute('aria-label',$('metric').value);function add(tag,attrs,text){const n=document.createElementNS(ns,tag);for(const [k,v]of Object.entries(attrs))n.setAttribute(k,v);if(text!==undefined)n.textContent=text;svg.append(n)}for(let i=0;i<4;i++){let y=20+i*65;add('line',{x1:80,x2:880,y1:y,y2:y,stroke:'#303b33'});add('text',{x:5,y:y+5,fill:'#a1afa4','font-size':13},fmt(hi-(hi-lo)*i/3))}add('polyline',{points:pts.map(([x,y])=>`${80+(x-min)/(max-min||1)*800},${20+(hi-y)/(hi-lo)*195}`).join(' '),fill:'none',stroke:'#caf56a','stroke-width':2});add('text',{x:80,y:247,fill:'#a1afa4'},min);add('text',{x:880,y:247,fill:'#a1afa4','text-anchor':'end'},max+' 輪');$('plot').append(svg)}
$('version').onchange=version;$('run').onchange=run;$('metric').onchange=draw;
fetch('./data.json').then(r=>{if(!r.ok)throw Error('無法載入資料：'+r.status);return r.json()}).then(d=>{data=d;$('stamp').textContent='資料匯出時間：'+new Date(d.exported_at*1000).toLocaleString();options($('version'),d.versions.map(v=>[v.id,v.id+' · '+v.name]));if(d.versions.length){$('version').value=d.versions.at(-1).id;version()}else $('error').textContent='尚未匯出版本'}).catch(e=>{$('error').textContent=e.message;$('stamp').textContent='資料未載入'});
</script></html>
